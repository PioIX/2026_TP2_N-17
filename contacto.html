<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="contacto.html" aria-current="page">Contacto</a></li>
                <li><a href="reseñas.html">Reseñas</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page">
        <section class="contact-hero">
            <h1>Contactate con nosotros</h1>
            <p>Envía tu consulta y te responderemos lo antes posible. Estamos aquí para ayudarte con tus pedidos y sugerencias.</p>
        </section>

        <section class="contact-card">
            <form action="https://formspree.io/f/xkoajwly" method="POST">
                <label>
                    Ingrese su nombre
                    <input type="text" name="name" required>
                </label>
                <label>
                    Ingrese su email
                    <input type="email" name="email" required>
                </label>
                <label>
                    Su mensaje
                    <textarea name="message" required></textarea>
                </label>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
</body>
</html>
